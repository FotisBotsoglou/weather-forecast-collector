x-app: &app
  build:
    context: .
    target: app
  env_file: .env
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/create-test-database.sh:/docker-entrypoint-initdb.d/create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: sh -c "php artisan migrate --force && php artisan db:seed --force"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    command: php artisan schedule:work
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  tests:
    build:
      context: .
      target: test
    env_file: .env
    environment:
      APP_ENV: testing
      DB_DATABASE: weather_test
      CACHE_STORE: array
      LOG_CHANNEL: "null"
      WEATHER_PROVIDERS: open_meteo,weatherapi
      WEATHERAPI_KEY: test-key
    command: php vendor/bin/phpunit
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
